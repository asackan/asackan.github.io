baseURL = 'https://asackan.github.io/'
languageCode = 'ko-kr'
title = 'asackan'
theme = 'PaperMod'
defaultContentLanguage = 'ko'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.ko]
    languageName = '한국어'
    weight = 1
  [languages.en]
    languageName = 'English'
    weight = 2
    title = 'asackan'
    [languages.en.params]
[pagination]
  pagerSize = 10

[params]
  env = 'production'
  author = 'asackan'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  showtoc = true
  tocopen = false
  hidemeta = false
  hideSummary = false
  comments = true
  disableSpecial1stPost = true
  sidebar_bio = '기록하고 생각하는 공간'
  # sidebar_avatar = '/images/avatar.jpg'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/asackan'

# LinkedIn 추가 예시:
# [[params.socialIcons]]
#   name = 'linkedin'
#   url = 'https://linkedin.com/in/yourprofile'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
